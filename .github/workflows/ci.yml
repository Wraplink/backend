name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before formatting audit
        run: go test ./...

      - name: Vet before formatting audit
        run: go vet ./...

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$files"
            echo "::warning::Go formatting debt remains; tests and vet were already executed."
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
