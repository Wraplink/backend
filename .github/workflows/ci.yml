name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wraplink_test
          POSTGRES_PASSWORD: wraplink_test
          POSTGRES_DB: wraplink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wraplink_test -d wraplink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wraplink_test:wraplink_test@localhost:5432/wraplink_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install migration runner
        run: go install github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Apply PostgreSQL migrations
        run: $(go env GOPATH)/bin/migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test before formatting audit
        run: go test ./...

      - name: Vet before formatting audit
        run: go vet ./...

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$files"
            echo "::warning::Go formatting debt remains; tests and vet were already executed."
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
