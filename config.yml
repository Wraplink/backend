app:
  name: wraplink-api
  environment: development
  frontend-url: http://localhost:3000

http:
  host: 0.0.0.0
  port: 7080
  read-timeout: 15s
  write-timeout: 15s
  idle-timeout: 60s
  shutdown-timeout: 10s

database:
  url: ${DATABASE_URL}
  max-conns: 20
  min-conns: 2
  max-conn-lifetime: 1h
  max-conn-idle-time: 30m

security:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 720h
  secure-cookies: false
  refresh-cookie-domain: ""
#  refresh-cookie-domain: ".wraplink.ir"

payments:
  dev-settlement-key: ${PAYMENTS_DEV_SETTLEMENT_KEY}

network:
  # Trusted network integrations. Leave empty to disable each internal API.
  usage-ingest-key: ${NETWORK_USAGE_INGEST_KEY}
  # Shared with dns-control for entitlement snapshots and DNS-node registration.
  control-sync-key: ${NETWORK_CONTROL_SYNC_KEY}
  # Backend uses DNS Control HTTP API for original Full Route DNS lookups.
  # Use a private reachable URL. No direct public DNS access is required.
  dns-control-url: ${DNS_CONTROL_API_URL}
  dns-control-token: ${DNS_CONTROL_API_TOKEN}
  # Registered dns-control nodes older than this are excluded from DNS selection.
  control-node-offline-after: 45s

  # Optional fallback DNS values. Healthy registered dns-control addresses are
  # selected first and these are used only if fewer than two are available.
  dns-servers: []
  proxy:
    host: ""
    port: 0
    protocol: ""

cors:
  allowed-origins:
    - http://localhost:3000
    - https://wraplink.ir
    - https://www.wraplink.ir
server:
  # Set only actual local reverse-proxy addresses or Nginx peer CIDRs.\n  trusted-proxies: []
