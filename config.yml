app:
  name: wraplink-api
  environment: development
  frontend-url: http://localhost:3000

http:
  host: 0.0.0.0
  port: 7080
  read-timeout: 15s
  write-timeout: 15s
  idle-timeout: 60s
  shutdown-timeout: 10s

database:
  url: ${DATABASE_URL}
  max-conns: 20
  min-conns: 2
  max-conn-lifetime: 1h
  max-conn-idle-time: 30m

security:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 720h
  secure-cookies: false
  refresh-cookie-domain: ""
#  refresh-cookie-domain: ".wraplink.ir"

payments:
  dev-settlement-key: ${PAYMENTS_DEV_SETTLEMENT_KEY}

network:
  # Trusted network integrations. Leave empty to disable each internal API.
  usage-ingest-key: ${NETWORK_USAGE_INGEST_KEY}
  # Shared only with dns-control for the read-only entitlement snapshot.
  control-sync-key: ${NETWORK_CONTROL_SYNC_KEY}

  dns-servers: []
  proxy:
    host: ""
    port: 0
    protocol: ""

cors:
  allowed-origins:
    - http://localhost:3000
    - https://wraplink.ir
    - https://www.wraplink.ir
server:
  trusted-proxies: []
