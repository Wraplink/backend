app:
  name: wraplink-api
  environment: development
  frontend-url: http://localhost:3000

http:
  host: 0.0.0.0
  port: 7080
  read-timeout: 15s
  write-timeout: 15s
  idle-timeout: 60s
  shutdown-timeout: 10s

database:
  url: ${DATABASE_URL}
  max-conns: 20
  min-conns: 2
  max-conn-lifetime: 1h
  max-conn-idle-time: 30m

security:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 720h
  # Local HTTP development
  secure-cookies: false
  # Empty means current host
  refresh-cookie-domain: ""
#  refresh-cookie-domain: ".wraplink.ir"

payments:
  # Development only. Leave empty to disable the local settlement endpoint.
  # Must be at least 32 characters when configured and must be empty in production.
  dev-settlement-key: ${PAYMENTS_DEV_SETTLEMENT_KEY}

network:
  # Shared only with trusted edge/master services. Leave empty to disable usage ingest.
  usage-ingest-key: ${NETWORK_USAGE_INGEST_KEY}
  # Environment-specific access details returned to users with active subscriptions.
  dns-servers: []
  proxy:
    host: ""
    port: 0
    protocol: ""

cors:
  allowed-origins:
    - http://localhost:3000
    - https://wraplink.ir
    - https://www.wraplink.ir
server:
  trusted-proxies: []